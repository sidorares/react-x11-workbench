version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Moving either react-x11 package is a deliberate, verified step —
      # screenshots included (AGENTS.md, "Pins") — not a weekly PR. Patches
      # are fine; majors (and pre-1.0 minors) stay manual.
      - dependency-name: react-x11
        update-types: [version-update:semver-major]
      - dependency-name: '@react-x11/components'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
